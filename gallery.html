<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renders | Biraj Kharel</title>
    <meta name="description" content="CAD renders, simulation images, build photos, and photography by Biraj Kharel.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="css/fusion.css?v=202611232304">
    <style>
        .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 18px; }
        .tile { background: #fff; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; text-align: left; padding: 0; transition: border-color .15s, box-shadow .15s, transform .15s; }
        .tile:hover { border-color: var(--select); box-shadow: 0 0 0 2px var(--select-soft), var(--shadow); transform: translateY(-2px); }
        .tile .img { aspect-ratio: 4 / 3; background: #eef1f4; overflow: hidden; }
        .tile img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
        .tile:hover img { transform: scale(1.05); }
        .tile .cap { padding: 8px 12px; display: grid; }
        .tile b { font-size: 14px; }
        .tile small { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
        .viewer { position: fixed; inset: 0; z-index: 100; background: #1c1d20; display: none; grid-template-rows: 44px 1fr auto; color: #e6e6e6; }
        .viewer.open { display: grid; }
        .v-top { display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #2b2d30; font-size: 13px; }
        .v-top .ti { color: var(--orange); }
        .v-top .count { font-family: var(--mono); font-size: 12px; color: #9aa0a6; }
        .v-top button { margin-left: auto; color: #e6e6e6; font-size: 22px; }
        .v-stage { position: relative; display: grid; place-items: center; padding: 16px 64px; min-height: 0; background: radial-gradient(circle at 50% 40%, #3a3d42, #1c1d20 70%); }
        .v-stage img { max-width: 100%; max-height: calc(100vh - 190px); object-fit: contain; border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,.5); background: #fff; }
        .v-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff; font-size: 22px; display: grid; place-items: center; }
        .v-nav:hover { background: var(--select); }
        .v-prev { left: 12px; } .v-next { right: 12px; }
        .v-info { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 18px; background: #2b2d30; }
        .v-info b { font-size: 15px; } .v-info p { font-size: 13px; color: #b9bec4; }
        @media (max-width: 600px) { .v-stage { padding: 10px; } .v-nav { width: 36px; height: 36px; } }
    </style>
</head>
<body data-page="gallery" data-root="">
<main class="canvas" id="main">
  <div class="canvas-inner">
    <div class="crumb"><i class="ti ti-cube"></i> <a href="index.html">Biraj_Kharel v26</a> &rsaquo; Render &rsaquo; Render gallery</div>
    <h1 class="page-title">Renders</h1>
    <p class="page-sub">CAD renders, simulation results, build photos, and some photography. Click any image to open it full size, then use the arrows or your keyboard to browse.</p>

    <div class="data-toolbar">
      <div class="flts" id="flts">
        <button class="flt active" data-f="all">All</button>
        <button class="flt" data-f="renders">CAD renders</button>
        <button class="flt" data-f="simulations">Simulations</button>
        <button class="flt" data-f="projects">Build photos</button>
        <button class="flt" data-f="photography">Photography</button>
      </div>
    </div>

    <div class="rgrid" id="rgrid"></div>
    <div class="status-foot"><span id="cnt">Render queue · 0 errors</span><span>&copy; 2026 Biraj Kharel</span></div>
  </div>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Image viewer">
  <div class="v-top"><i class="ti ti-photo"></i><span id="v-title"></span><span class="count" id="v-count"></span><button id="v-close" aria-label="Close viewer"><i class="ti ti-x" style="color:#e6e6e6"></i></button></div>
  <div class="v-stage"><button class="v-nav v-prev" id="v-prev" aria-label="Previous image"><i class="ti ti-chevron-left"></i></button><img id="v-img" alt=""><button class="v-nav v-next" id="v-next" aria-label="Next image"><i class="ti ti-chevron-right"></i></button></div>
  <div class="v-info"><div><b id="v-cap"></b><p id="v-desc"></p></div><a class="btn primary" id="v-link" href="#"><i class="ti ti-box"></i> <span>Open project</span></a></div>
</div>

<script>
(function () {
  const items = [
    ['renders', 'Gallery/1967 shelby.png', '1967 Shelby', 'Surface model of the upper body of a 1967 Shelby.', ''],
    ['renders', 'Gallery/Gear_box_design.png', 'Gearbox design', 'Gear-train CAD model.', ''],
    ['renders', 'Gallery/Robotic arm.png', 'Robotic arm', 'CAD model of a robotic arm.', 'project file/robotic-arm.html'],
    ['renders', 'Gallery/Rendered Robot 1.4.jpg', 'Robot render', 'Rendered robot model.', ''],
    ['renders', 'Gallery/fork lift.png', 'Forklift', 'CAD model of a forklift.', ''],
    ['renders', 'Gallery/Flag_Pole Mount.png', 'Flag pole mount', 'Mechanical mount design.', ''],
    ['renders', 'Gallery/HeadPhoone.png', 'Headphones', 'Consumer-product surface model.', ''],
    ['renders', 'Gallery/Mintendo Model.png', 'Handheld console', '3D model of a handheld game console.', ''],
    ['renders', 'Gallery/Wall_E.PNG', 'Wall-E', 'Character model built for practice.', ''],
    ['renders', 'Gallery/Sword_Stone_Bg.png', 'Sword in the stone', 'Blender render.', ''],
    ['renders', 'project images/modular electric vehicle.png', 'Modular EV concept', 'Concept render of the modular electric vehicle.', 'project file/modular_vehicle.html'],
    ['renders', 'project images/isometric car.png', 'Maruti 800 EV model', 'Isometric model of the converted car.', 'project file/ic to electric.html'],
    ['simulations', 'project images/modular/fig03.png', 'Crash: directional deformation', 'Explicit dynamics, 50 mph frontal impact · max 46.4 mm.', 'project file/modular_vehicle.html'],
    ['simulations', 'project images/modular/fig15.png', 'Static: total deformation', '2000 kg distributed load · max 0.55 mm.', 'project file/modular_vehicle.html'],
    ['simulations', 'project images/modular/fig13.png', 'Modal: 184.19 Hz', 'Mode shape of the modular EV chassis.', 'project file/modular_vehicle.html'],
    ['simulations', 'project images/Equivalent stress bus.png', 'Bus chassis stress', 'Von Mises stress at 25% overload.', 'project file/Public Bus Conversion.html'],
    ['simulations', 'project images/battery thermal modelling.png', 'Battery cooling CFD', 'Temperature field in a liquid-cooled module.', 'project file/battery cooling.html'],
    ['simulations', 'project images/Corelation .png', 'EV energy correlations', 'Correlation matrix from on-road testing.', 'project file/energy consumption.html'],
    ['projects', 'Gallery/shell eco front.jpg', 'Shell Eco-marathon: front', 'Team Junkiri vehicle, Lombok 2022.', 'project file/shell-eco-marathon.html'],
    ['projects', 'Gallery/shell eco side.jpg', 'Shell Eco-marathon: side', 'Full vehicle view.', 'project file/shell-eco-marathon.html'],
    ['projects', 'project images/Front.jpg', 'Eicher bus', 'The bus selected for EV conversion.', 'project file/Public Bus Conversion.html'],
    ['projects', 'project images/Engine Removal from Bus.png', 'Engine removal', 'Lifting the diesel engine out of the bus.', 'project file/Public Bus Conversion.html'],
    ['projects', 'project images/maruti disassembled.jpg', 'Maruti 800 teardown', 'Engine bay after the IC engine came out.', 'project file/ic to electric.html'],
    ['projects', 'project images/Maruticar Wiring.png', 'HV wiring', 'Controller and high-voltage wiring in the converted car.', 'project file/ic to electric.html'],
    ['photography', 'Gallery/Boat.jpg', 'Begnas Lake', 'Boats on Begnas Lake, Nepal.', ''],
    ['photography', 'Gallery/Ku ground.jpg', 'Kathmandu University', 'The ground and multi-purpose hall.', ''],
    ['photography', 'Gallery/mahakali pul.jpg', 'Mahakali Bridge', 'The bridge connecting Nepal and India.', ''],
    ['photography', 'Gallery/plane.png', 'Above the clouds', 'From the plane window.', ''],
    ['photography', 'Gallery/houses.jpg', 'Hillside houses', 'A snap of time.', '']
  ];
  const grid = document.getElementById('rgrid'), viewer = document.getElementById('viewer');
  let filter = 'all', list = [], cur = 0;
  const label = { renders: 'CAD render', simulations: 'Simulation', projects: 'Build photo', photography: 'Photography' };

  function render() {
    list = items.filter(x => filter === 'all' || x[0] === filter);
    grid.innerHTML = list.map((x, i) => '<button class="tile" data-i="' + i + '"><div class="img"><img src="' + encodeURI(x[1]) + '" alt="' + x[2] + '" loading="lazy"></div><div class="cap"><b>' + x[2] + '</b><small>' + label[x[0]] + '</small></div></button>').join('');
    grid.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => open(+t.dataset.i)));
    document.querySelectorAll('.flt').forEach(b => b.classList.toggle('active', b.dataset.f === filter));
    document.getElementById('cnt').textContent = 'Render queue · ' + list.length + ' images · 0 errors';
  }
  function open(i) {
    cur = (i + list.length) % list.length; const x = list[cur];
    const img = document.getElementById('v-img');
    img.src = encodeURI(x[1]); img.alt = x[2];
    document.getElementById('v-title').textContent = label[x[0]];
    document.getElementById('v-count').textContent = (cur + 1) + ' / ' + list.length;
    document.getElementById('v-cap').textContent = x[2];
    document.getElementById('v-desc').textContent = x[3];
    const l = document.getElementById('v-link');
    if (x[4]) { l.href = x[4]; l.removeAttribute('target'); l.querySelector('span').textContent = 'Open project'; }
    else { l.href = encodeURI(x[1]); l.target = '_blank'; l.querySelector('span').textContent = 'Open full image'; }
    viewer.classList.add('open');
  }
  const close = () => viewer.classList.remove('open');
  document.getElementById('v-close').onclick = close;
  document.getElementById('v-prev').onclick = () => open(cur - 1);
  document.getElementById('v-next').onclick = () => open(cur + 1);
  viewer.addEventListener('click', e => { if (e.target.classList.contains('v-stage')) close(); });
  document.addEventListener('keydown', e => { if (!viewer.classList.contains('open')) return; if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') open(cur - 1); if (e.key === 'ArrowRight') open(cur + 1); });
  document.querySelectorAll('.flt').forEach(b => b.addEventListener('click', () => { filter = b.dataset.f; history.replaceState(null, '', filter === 'all' ? location.pathname : '#' + filter); render(); }));
  const h = location.hash.slice(1); if (label[h]) filter = h;
  render();
})();
</script>
<script src="js/site-data.js?v=202611232304"></script>
<script src="js/fusion.js?v=202611232304"></script>
</body>
</html>
